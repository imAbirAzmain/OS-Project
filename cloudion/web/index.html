<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mini Cloud - Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 15px 20px; border-radius: 8px; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .card { background: #1e293b; padding: 20px; border-radius: 8px; }
        .full-card { grid-column: span 2; background: #1e293b; padding: 20px; border-radius: 8px; }
        input, select { width: 100%; padding: 8px; margin: 6px 0; border-radius: 4px; border: 1px solid #475569; background: #0f172a; color: #fff; box-sizing: border-box; }
        button { background: #38bdf8; color: #0f172a; border: none; padding: 10px 15px; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 5px; width: 100%; }
        button:hover { background: #0284c7; color: #fff; }
        .btn-sm { padding: 4px 10px; width: auto; font-size: 12px; margin: 0; }
        .chat-box { background: #0f172a; height: 120px; padding: 10px; overflow-y: scroll; border: 1px solid #475569; margin-bottom: 10px; font-family: monospace; font-size: 13px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; text-align: left; font-size: 14px; }
        th, td { padding: 10px; border-bottom: 1px solid #334155; }
        th { background: #0f172a; color: #38bdf8; }
        hr { border: 0; border-top: 1px solid #334155; margin: 15px 0; }
    </style>
</head>
<body>
    <div class="header">
        <h2>☁️ Mini Cloud Workspace</h2>
        <div>User: <strong id="user-tag">...</strong> | <a href="/login.html" style="color:#f43f5e;" onclick="localStorage.clear()">Logout</a></div>
    </div>

    <div class="grid">
        <!-- 1. UPLOAD SECTION -->
        <div class="card">
            <h3>📤 Upload File</h3>
            <label>Upload Category:</label>
            <select id="upload-category" onchange="toggleTarget()">
                <option value="personal">🔒 Personal Storage</option>
                <option value="direct">👤 One-to-One Direct Share</option>
                <option value="group">👥 Group File Share</option>
                <option value="global">🌐 Local / Global Public</option>
            </select>

            <div id="target-box" style="display:none;">
                <input type="text" id="upload-target" placeholder="Recipient Username or Group Name">
            </div>

            <input type="file" id="file-input">
            <button onclick="uploadFile()">Upload File</button>
        </div>

        <!-- 2. GROUP MANAGEMENT -->
        <div class="card">
            <h3>👥 Group Management</h3>
            <input type="text" id="group-name" placeholder="New Group Name">
            <button onclick="createGroup()">Create Group</button>
            
            <hr>
            
            <h4>➕ Add Member to Group</h4>
            <input type="text" id="member-group-name" placeholder="Target Group Name">
            <input type="text" id="member-user-id" placeholder="User ID to Add">
            <button onclick="addUserToGroup()">Add Member to Group</button>
        </div>

        <!-- 3. FILE EXPLORER & DOWNLOADER -->
        <div class="full-card">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h3>📁 File Explorer & Downloader</h3>
                <button class="btn-sm" onclick="fetchFiles()">🔄 Refresh File List</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>File Name</th>
                        <th>Category</th>
                        <th>Size (Bytes)</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="file-table-body">
                    <tr><td colspan="4">Click "Refresh File List" to view files.</td></tr>
                </tbody>
            </table>
        </div>

        <!-- 4. CHAT SYSTEM -->
        <div class="full-card">
            <h3>💬 Chat Channel</h3>
            <div style="display:flex; gap:10px;">
                <select id="chat-type" style="width:30%;">
                    <option value="direct">1-to-1 Direct Inbox</option>
                    <option value="group">Group Channel</option>
                </select>
                <input type="text" id="chat-target" placeholder="Recipient Username or Group Name" style="width:70%;">
            </div>

            <button onclick="readChat()">Fetch Chat Messages</button>
            <div class="chat-box" id="chat-logs">-- Select chat type and target --</div>

            <input type="text" id="chat-msg" placeholder="Type your message here...">
            <button onclick="sendChat()">Send Message</button>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('cloud_token') || new URLSearchParams(window.location.search).get('token');
        const user = localStorage.getItem('cloud_user') || 'User';
        document.getElementById('user-tag').innerText = user;

        if (!token) window.location.href = '/login.html';

        function toggleTarget() {
            const cat = document.getElementById('upload-category').value;
            document.getElementById('target-box').style.display = (cat === 'direct' || cat === 'group') ? 'block' : 'none';
        }

        async function createGroup() {
            const name = document.getElementById('group-name').value.trim();
            if (!name) return alert("Enter group name");
            const res = await fetch(`/group/create?name=${name}&token=${token}`);
            const data = await res.json();
            alert(data.message);
        }

        async function addUserToGroup() {
            const group = document.getElementById('member-group-name').value.trim();
            const member = document.getElementById('member-user-id').value.trim();
            if (!group || !member) return alert("Enter both Group Name and User ID!");

            const res = await fetch(`/group/add_user?group=${group}&user=${member}&token=${token}`);
            const data = await res.json();
            alert(data.message);
        }

        async function uploadFile() {
            const file = document.getElementById('file-input').files[0];
            const category = document.getElementById('upload-category').value;
            const target = document.getElementById('upload-target').value.trim();

            if (!file) return alert("Select a file first!");

            const url = `/file/upload?filename=${file.name}&category=${category}&target=${target}&token=${token}`;
            const res = await fetch(url, { method: 'POST', body: file });
            const txt = await res.text();
            alert(txt);
            fetchFiles();
        }

        async function fetchFiles() {
            const res = await fetch(`/file/list?token=${token}`);
            const data = await res.json();
            const tbody = document.getElementById('file-table-body');
            tbody.innerHTML = '';

            if (!data.files || data.files.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4">No files uploaded yet.</td></tr>';
                return;
            }

            data.files.forEach(f => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${f.name}</strong></td>
                    <td>${f.category}</td>
                    <td>${f.size} B</td>
                    <td>
                        <a href="/file/download?filepath=${encodeURIComponent(f.path)}&token=${token}" download="${f.name}">
                            <button class="btn-sm">⬇️ Download</button>
                        </a>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function sendChat() {
            const type = document.getElementById('chat-type').value;
            const target = document.getElementById('chat-target').value.trim();
            const msg = document.getElementById('chat-msg').value.trim();

            if (!target || !msg) return alert("Target and message required!");

            await fetch(`/chat/send?type=${type}&target=${target}&msg=${encodeURIComponent(msg)}&token=${token}`);
            document.getElementById('chat-msg').value = '';
            readChat();
        }

        async function readChat() {
            const type = document.getElementById('chat-type').value;
            const target = document.getElementById('chat-target').value.trim();

            const res = await fetch(`/chat/read?type=${type}&target=${target}&token=${token}`);
            const txt = await res.text();
            document.getElementById('chat-logs').innerText = txt;
        }

        // Auto-fetch file list on page load
        fetchFiles();
    </script>
</body>
</html>
